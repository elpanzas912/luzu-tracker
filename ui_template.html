<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luzu Tracker</title>
<style>
:root{
  --bg:#f5f5f2; --card:#fff; --ink:#16181d; --mut:#656b75; --line:#e3e3dd;
  --acc:#d6204a; --acc-soft:#fbe4ea; --bar:#cdd1d8; --cell:#d6204a; --off:#ececE7;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1014; --card:#171a21; --ink:#eceef2; --mut:#99a1ad; --line:#272c35;
    --acc:#ff5f82; --acc-soft:#3a1c26; --bar:#323946; --cell:#ff5f82; --off:#20242c;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1014; --card:#171a21; --ink:#eceef2; --mut:#99a1ad; --line:#272c35;
  --acc:#ff5f82; --acc-soft:#3a1c26; --bar:#323946; --cell:#ff5f82; --off:#20242c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:28px 16px 64px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;margin-bottom:20px}
h1{font-size:24px;margin:0;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile b{display:block;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile span{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{font-size:14px;margin:0 0 12px;color:var(--mut);font-weight:600}
.chart{display:flex;align-items:flex-end;gap:3px;height:150px}
.bar{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;
  background:none;border:0;padding:0;cursor:pointer;color:var(--mut);font:inherit;font-size:10px}
.bar i{display:block;width:100%;background:var(--bar);border-radius:3px 3px 0 0;min-height:2px;transition:background .15s}
.bar:hover i{background:var(--acc);opacity:.7}
.bar[aria-pressed="true"] i{background:var(--acc);opacity:1}
.bar[aria-pressed="true"]{color:var(--ink);font-weight:700}
.bar:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
.bar .n{font-size:10px;font-variant-numeric:tabular-nums}
.tabs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tab{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer;font:inherit}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:focus-visible,input:focus-visible,.nav button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.spacer{flex:1}
input[type=search]{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:8px 12px;border-radius:8px;font:inherit;min-width:220px}
.dayhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.dayhead h3{margin:0;font-size:18px}
.dayhead h3::first-letter{text-transform:uppercase}
.dayhead small{color:var(--mut)}
.nav button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
.nav button:disabled{opacity:.4;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.vid{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;color:inherit;text-decoration:none}
.vid:hover{border-color:var(--acc)}
.vid:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.thumb{position:relative;aspect-ratio:16/9;background:var(--off)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.78);color:#fff;font-size:12px;padding:1px 6px;border-radius:4px;font-variant-numeric:tabular-nums}
.vbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.vtitle{font-weight:600;font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{color:var(--mut);font-size:12px;margin-top:auto}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--acc-soft);color:var(--acc);font-weight:600}
.badge.n{background:var(--off);color:var(--mut)}
.empty{color:var(--mut);padding:24px 4px}
.mx{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:separate;border-spacing:0;font-size:12px}
th,td{padding:0;text-align:center}
thead th{position:sticky;top:0;background:var(--card);z-index:2;color:var(--mut);font-weight:500;padding:6px 0;min-width:22px}
thead th.we{color:var(--ink);font-weight:700}
td.t,th.t{position:sticky;left:0;background:var(--card);z-index:1;text-align:left;padding:6px 12px;min-width:300px;max-width:300px;border-right:1px solid var(--line)}
thead th.t{z-index:3}
td.t a{color:var(--ink);text-decoration:none;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.t a:hover{color:var(--acc)}
td.c{height:26px}
td.c span{display:block;margin:3px 1px;height:20px;border-radius:3px;background:var(--off)}
td.c.on span{background:var(--cell)}
tr:hover td.t{background:var(--acc-soft)}
.pos{color:#1c8a4e;font-weight:600}.neg{color:var(--acc);font-weight:600}
.vw{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.vw b{font-variant-numeric:tabular-nums}
.vt{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.vt table{width:100%;font-size:13px}
.vt th{position:sticky;top:0;background:var(--card);padding:10px 12px;text-align:right;color:var(--mut);font-weight:600;white-space:nowrap;cursor:pointer;user-select:none;border-bottom:1px solid var(--line)}
.vt th:first-child,.vt td:first-child{text-align:left}
.vt th[aria-sort]{color:var(--ink)}
.vt td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.vt td:first-child{white-space:normal;min-width:260px;max-width:420px}
.vt td a{color:var(--ink);text-decoration:none}.vt td a:hover{color:var(--acc)}
.vt tr:last-child td{border-bottom:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc)}
.spark{vertical-align:middle}
.cl{cursor:pointer}.cl:hover td{background:var(--acc-soft)}
.cl:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.vt tr.det td{background:var(--off);text-align:left;padding:14px 16px;white-space:normal;max-width:none}
.vt tr.det:hover td{background:var(--off)}
.gchart{display:flex;align-items:flex-end;gap:4px;height:140px;margin-top:10px}
.gbar{flex:1;max-width:52px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;font-size:10px;color:var(--mut)}
.gbar i{display:block;width:100%;border-radius:3px 3px 0 0;min-height:2px;background:var(--bar)}
.gbar.on i{background:var(--acc)}
.gbar.on{color:var(--ink)}
.lg{display:flex;gap:16px;font-size:12px;color:var(--mut);margin-top:8px}
.lg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:var(--bar);vertical-align:-1px}
.lg span.r::before{background:var(--acc)}
.note{color:var(--mut);font-size:13px;margin:0 0 10px}
.foot{color:var(--mut);font-size:12px;margin-top:20px;line-height:1.6}
@media (max-width:600px){td.t,th.t{min-width:180px;max-width:180px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Luzu Tracker</h1>
      <div class="sub">Videos de YouTube con pauta · Google Ads Transparency Center · Argentina</div>
    </div>
    <div class="sub" id="gen"></div>
  </header>

  <div class="stats" id="stats"></div>

  <section class="card">
    <h2>Videos con pauta por día (tocá una barra)</h2>
    <div class="chart" id="chart" role="group" aria-label="Videos con pauta por día"></div>
  </section>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-day" aria-selected="true">Por día</button>
    <button class="tab" role="tab" id="tab-vw" aria-selected="false">Visitas</button>
    <button class="tab" role="tab" id="tab-mx" aria-selected="false">Matriz de todos los videos</button>
    <span class="spacer"></span>
    <input type="search" id="q" placeholder="Buscar por título…" aria-label="Buscar por título">
  </div>

  <section id="view"></section>

  <p class="foot" id="foot"></p>
</div>

<script>
const D = __DATA__;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fLong = new Intl.DateTimeFormat('es-AR', {weekday:'long', day:'numeric', month:'long', timeZone:'UTC'});
const fMini = new Intl.DateTimeFormat('es-AR', {day:'numeric', month:'short', timeZone:'UTC'});
const dt = iso => new Date(iso + 'T00:00:00Z');

const days = D.days;
const vid = Object.fromEntries(D.videos.map(v => [v.id, v]));
const perDay = days.map(d => D.perDay[d] || {});
const counts = perDay.map(o => Object.keys(o).length);
const creatives = perDay.map(o => Object.values(o).reduce((a, b) => a + b, 0));
let sel = days.length - 1, tab = 'day', q = '';
const nf = new Intl.NumberFormat('es-AR');
const cf = new Intl.NumberFormat('es-AR', {notation:'compact', maximumFractionDigits:1});
const sgn = n => n == null ? '—' : (n > 0 ? '+' : n < 0 ? '−' : '') + cf.format(Math.abs(n));
const addDays = (iso, n) => new Date(dt(iso).getTime() + n * 864e5).toISOString().slice(0, 10);
D.videos.forEach(v => {
  const s = v.snaps, last = s[s.length - 1], prev = s[s.length - 2];
  v.views = last ? last[1] : null; v.vday = last ? last[0] : null;
  v.delta = prev ? v.views - prev[1] : null; v.prevDay = prev ? prev[0] : null;
  const base = last && [...s].reverse().find(x => x[0] <= addDays(last[0], -7));
  v.d7 = base ? v.views - base[1] : null;
  v.onToday = v.last === days.length - 1;
  v.daySet = new Set(v.days);
});
const totalViews = D.videos.reduce((a, v) => a + (v.views || 0), 0);
const measured = D.videos.filter(v => v.delta != null);
const totalDelta = measured.reduce((a, v) => a + v.delta, 0);

// Stats
const lastFull = days.length - (days[days.length - 1] === D.today ? 2 : 1);
const activeDays = counts.filter(n => n > 0);
$('#gen').textContent = 'Actualizado ' + D.generated;
$('#stats').innerHTML = [
  [D.videos.length, 'videos distintos con pauta'],
  [counts[lastFull] ?? 0, 'videos con pauta el ' + (days[lastFull] ? fMini.format(dt(days[lastFull])) : '—')],
  [activeDays.length ? Math.round(activeDays.reduce((a, b) => a + b, 0) / activeDays.length) : 0, 'promedio por día con pauta'],
  [counts.filter(n => n === 0).length, 'días sin videos con pauta'],
  [cf.format(totalViews), 'visitas acumuladas de estos videos'],
  [measured.length ? sgn(totalDelta) : '—', measured.length ? 'visitas ganadas desde la medición anterior' : 'se compara desde la 2.ª medición'],
].map(([n, l]) => `<div class="tile"><b>${n}</b><span>${l}</span></div>`).join('');

// Chart
function renderChart() {
  const max = Math.max(...counts, 1);
  $('#chart').innerHTML = days.map((d, i) => {
    const date = dt(d), first = date.getUTCDate() === 1 || i === 0;
    const label = first ? fMini.format(date).replace('.', '') : date.getUTCDate();
    return `<button class="bar" data-i="${i}" aria-pressed="${i === sel}" title="${esc(fLong.format(date))}: ${counts[i]} videos">
      <span class="n">${counts[i]}</span><i style="height:${Math.max(counts[i] / max * 100 - 22, 0)}%"></i><span>${label}</span></button>`;
  }).join('');
}

function matches(v) { return !q || v.title.toLowerCase().includes(q); }

function card(v, n, i) {
  const badges = [];
  if (i > 0 && v.first === i) badges.push('<span class="badge">Empieza hoy</span>');
  if (v.last === i && i < days.length - 1) badges.push('<span class="badge n">Último día</span>');
  if (n > 1) badges.push(`<span class="badge n">${n} creativos</span>`);
  return `<a class="vid" href="https://youtu.be/${v.id}" target="_blank" rel="noopener">
    <div class="thumb"><img loading="lazy" alt="" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg">${v.duration ? `<span class="dur">${esc(v.duration)}</span>` : ''}</div>
    <div class="vbody">
      <div class="vtitle">${esc(v.title)}</div>
      ${badges.length ? `<div class="badges">${badges.join('')}</div>` : ''}
      ${v.views != null ? `<div class="vw"><b>${nf.format(v.views)} visitas</b>${v.delta != null ? `<span class="${v.delta >= 0 ? 'pos' : 'neg'}" title="vs ${esc(v.prevDay)}">${sgn(v.delta)}</span>` : '<span class="meta" style="margin:0">1.ª medición</span>'}</div>` : ''}
      <div class="meta">${v.days.length} ${v.days.length === 1 ? 'día' : 'días'} con pauta · desde ${fMini.format(dt(days[v.first]))}</div>
    </div></a>`;
}

function renderDay() {
  const items = Object.entries(perDay[sel]).map(([id, n]) => [vid[id], n]).filter(([v]) => matches(v))
    .sort((a, b) => b[1] - a[1] || a[0].title.localeCompare(b[0].title));
  const partial = days[sel] === D.today ? ' · día parcial' : '';
  $('#view').innerHTML = `
    <div class="dayhead">
      <div><h3>${esc(fLong.format(dt(days[sel])))}</h3>
        <small>${counts[sel]} videos · ${creatives[sel]} creativos${partial}</small></div>
      <div class="nav"><button id="prev" ${sel === 0 ? 'disabled' : ''}>← Anterior</button>
        <button id="next" ${sel === days.length - 1 ? 'disabled' : ''}>Siguiente →</button></div>
    </div>
    ${items.length ? `<div class="grid">${items.map(([v, n]) => card(v, n, sel)).join('')}</div>`
      : `<div class="empty">${counts[sel] ? 'Ningún video coincide con la búsqueda.' : 'Sin videos con pauta este día en el Transparency Center.'}</div>`}`;
  $('#prev').onclick = () => select(sel - 1);
  $('#next').onclick = () => select(sel + 1);
}

function renderMatrix() {
  const vs = D.videos.filter(matches).sort((a, b) => a.first - b.first || a.title.localeCompare(b.title));
  const head = days.map(d => {
    const date = dt(d), dow = date.getUTCDay();
    return `<th class="${dow === 0 || dow === 6 ? 'we' : ''}" title="${esc(fLong.format(date))}">${date.getUTCDate()}</th>`;
  }).join('');
  const rows = vs.map(v => {
    const set = new Set(v.days);
    return `<tr><td class="t"><a href="https://youtu.be/${v.id}" target="_blank" rel="noopener" title="${esc(v.title)}">${esc(v.title)}</a></td>
      ${days.map((d, i) => `<td class="c ${set.has(i) ? 'on' : ''}" title="${esc(fMini.format(dt(d)))}"><span></span></td>`).join('')}</tr>`;
  }).join('');
  $('#view').innerHTML = vs.length ? `<div class="mx"><table><thead><tr><th class="t">${vs.length} videos</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`
    : '<div class="empty">Ningún video coincide con la búsqueda.</div>';
}

let sortKey = 'views', sortDir = -1;
const cols = [['title','Video'],['published','Publicado'],['views','Visitas'],['delta','Desde la medición anterior'],['d7','Últimos 7 días'],['ndays','Días con pauta'],['spark','Evolución'],['onToday','Pauta hoy']];
const hasPauta = (v, day) => { const i = days.indexOf(day); return i >= 0 && v.daySet.has(i); };
function spark(v) {
  const s = v.snaps;
  if (s.length < 2) return '<span class="meta">—</span>';
  const xs = s.map(x => x[1]), min = Math.min(...xs), max = Math.max(...xs), w = 70, h = 22;
  const pt = (y, i) => [(i / (xs.length - 1) * w).toFixed(1), (h - 2 - (max === min ? 0.5 : (y - min) / (max - min)) * (h - 4)).toFixed(1)];
  const segs = xs.slice(1).map((y, k) => {
    const [x1, y1] = pt(xs[k], k), [x2, y2] = pt(y, k + 1), on = hasPauta(v, s[k + 1][0]);
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${on ? 'var(--acc)' : 'var(--bar)'}" stroke-width="2" stroke-linecap="round"/>`;
  }).join('');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${segs}</svg>`;
}
function gainChart(v) {
  const s = v.snaps, gains = s.slice(1).map((x, k) => ({day: x[0], gain: x[1] - s[k][1], on: hasPauta(v, x[0])}));
  if (!gains.length) return '<p class="note" style="margin:0">Es la primera medición de este video: el gráfico aparece desde la segunda (mañana).</p>';
  const max = Math.max(...gains.map(g => g.gain), 1);
  const bars = gains.map(g => `<div class="gbar ${g.on ? 'on' : ''}" title="${esc(fLong.format(dt(g.day)))}: ${sgn(g.gain)} visitas · ${g.on ? 'con pauta' : 'sin pauta'}">
    <span>${sgn(g.gain)}</span><i style="height:${Math.max(g.gain / max * 100 - 24, 0)}%"></i><span>${dt(g.day).getUTCDate()}/${dt(g.day).getUTCMonth() + 1}</span></div>`).join('');
  return `<b>Visitas ganadas por día</b><div class="gchart">${bars}</div>
    <div class="lg"><span class="r">Con pauta</span><span>Sin pauta</span></div>`;
}
let openVid = null;
function renderViews() {
  const val = v => sortKey === 'title' ? v.title.toLowerCase() : sortKey === 'ndays' ? v.days.length : sortKey === 'onToday' ? +v.onToday : v[sortKey];
  const vs = D.videos.filter(matches).sort((a, b) => {
    const x = val(a), y = val(b);
    if (x == null) return 1; if (y == null) return -1;
    return (x > y ? 1 : x < y ? -1 : 0) * sortDir;
  });
  const th = cols.map(([k, l]) => `<th data-k="${k}" ${sortKey === k ? `aria-sort="${sortDir > 0 ? 'ascending' : 'descending'}"` : ''}>${l}${sortKey === k ? (sortDir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('');
  const cls = n => n == null ? '' : n >= 0 ? 'pos' : 'neg';
  const rows = vs.map(v => `<tr class="cl" data-id="${v.id}" tabindex="0" aria-expanded="${openVid === v.id}">
    <td><a href="https://youtu.be/${v.id}" target="_blank" rel="noopener">${esc(v.title)}</a></td>
    <td>${v.published ? esc(fMini.format(dt(v.published))) + ' ' + v.published.slice(0, 4) : '—'}</td>
    <td><b>${v.views != null ? nf.format(v.views) : '—'}</b></td>
    <td class="${cls(v.delta)}">${sgn(v.delta)}</td><td class="${cls(v.d7)}">${sgn(v.d7)}</td>
    <td>${v.days.length}</td><td>${spark(v)}</td><td>${v.onToday ? '<span class="dot" title="Con pauta hoy"></span>' : ''}</td></tr>${openVid === v.id ? `<tr class="det"><td colspan="8">${gainChart(v)}</td></tr>` : ''}`).join('');
  const first = D.videos.reduce((m, v) => v.snaps[0] && (!m || v.snaps[0][0] < m) ? v.snaps[0][0] : m, null);
  $('#view').innerHTML = `<p class="note">Visitas totales de cada video en YouTube (orgánicas + pagas), tocá un video para ver sus visitas por día (rojo = con pauta, gris = sin pauta), medidas una vez por día${first ? ' desde el ' + esc(fMini.format(dt(first))) : ''}. YouTube no da el histórico anterior.</p>
    <div class="vt"><table><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table></div>`;
  const toggle = tr => { if (!tr) return; openVid = openVid === tr.dataset.id ? null : tr.dataset.id; renderViews();
    const el = document.querySelector(`tr[data-id="${openVid}"]`); if (el) el.focus({preventScroll: true}); };
  $('#view tbody').onclick = e => { if (!e.target.closest('a')) toggle(e.target.closest('tr.cl')); };
  $('#view tbody').onkeydown = e => { if (e.key === 'Enter' && e.target.matches('tr.cl')) toggle(e.target); };
  $('#view thead').onclick = e => { const h = e.target.closest('th'); if (!h) return; const k = h.dataset.k; if (k === 'spark') return;
    sortDir = sortKey === k ? -sortDir : (k === 'title' ? 1 : -1); sortKey = k; renderViews(); };
}
function render() { renderChart(); tab === 'day' ? renderDay() : tab === 'vw' ? renderViews() : renderMatrix(); }
function select(i) { sel = Math.min(Math.max(i, 0), days.length - 1); render(); }
function setTab(t) {
  tab = t;
  $('#tab-day').setAttribute('aria-selected', t === 'day');
  $('#tab-mx').setAttribute('aria-selected', t === 'mx');
  $('#tab-vw').setAttribute('aria-selected', t === 'vw');
  render();
}

$('#chart').addEventListener('click', e => { const b = e.target.closest('.bar'); if (b) { tab = 'day'; setTab('day'); select(+b.dataset.i); } });
$('#tab-day').onclick = () => setTab('day');
$('#tab-mx').onclick = () => setTab('mx');
$('#tab-vw').onclick = () => setTab('vw');
$('#q').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); render(); });

$('#foot').innerHTML = `Fuente: ${esc(D.advertiser)} en el Ads Transparency Center de Google (plataforma YouTube, región Argentina). ` +
  'Muestra solo lo que Luzu paga como anuncio de Google; los sponsors dentro del video no aparecen. ' +
  'Google calcula los días en hora del Pacífico, no en hora argentina.';
render();
